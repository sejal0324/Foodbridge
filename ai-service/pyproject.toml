[project]
name = "foodbridge-ai-service"
version = "1.0.0"
description = "FoodBridge AI: stateless prediction, matching, optimisation and LLM-step service"
requires-python = ">=3.12,<3.13"

# Dependencies are pinned in requirements.txt / requirements-dev.txt (installed with uv).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "RUF",  # ruff-specific
  "ANN",  # type annotations
  "S",    # bandit (security)
  "DTZ",  # timezone-aware datetimes
  "PT",   # pytest style
]
ignore = [
  "ANN401",  # Any is legitimate for JSON payloads
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed fake secrets, seeded `random` for reproducible instances.
"tests/**" = ["S101", "S105", "S106", "S311", "ANN", "PT018"]
"training/**" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  # Starlette 1.x suggests a future httpx successor for TestClient; httpx is the pinned client.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
