# PostgreSQL 18 + PostGIS 3.6 for local development.
#
# This file is included by the root docker-compose.yml. Run it from the
# repository root so that the root .env file is used:
#
#   docker compose up -d db
#
# Data is kept in the named volume "pgdata". To reset the local database
# completely (destroys all local data): docker compose down -v
services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodbridge}
      POSTGRES_USER: ${POSTGRES_USER:-foodbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-foodbridge_test}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only; the database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
      # Mounted as a single file so the PostGIS image's own init script
      # (10_postgis.sh) in the same directory keeps running.
      - ./init/20-create-test-database.sh:/docker-entrypoint-initdb.d/20-create-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
